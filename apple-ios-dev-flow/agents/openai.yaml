interface:
  display_name: "Apple iOS Dev Flow"
  short_description: "Orchestrate local iOS development workflows"
  default_prompt: "Use $apple-ios-dev-flow as the local Apple-platform development orchestrator: start from current repository evidence, consult stored principles when judgment matters, apply HIG/Swift/sample-code gates, use the native Xcode MCP selection lifecycle for build/test/run/Preview/device evidence, invoke Build iOS Apps specialists only when their required tools exist, use sibling repositories only as read-only fallback evidence, then run the repository's documented verification contract before replying."
policy:
  allow_implicit_invocation: true
